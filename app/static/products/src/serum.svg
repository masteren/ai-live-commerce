<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 340 340">
  <!-- ヒアルロン酸美容液 30ml:すりガラスのスポイトボトル -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3DED5"/><stop offset=".3" stop-color="#F5F2EC"/>
      <stop offset=".65" stop-color="#ECE7DE"/><stop offset="1" stop-color="#D6D0C5"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9CDB5"/><stop offset=".4" stop-color="#F4DECB"/><stop offset="1" stop-color="#DDBEA4"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C1C1B"/><stop offset=".45" stop-color="#3B3B39"/><stop offset="1" stop-color="#171716"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="330" rx="64" ry="9" fill="#1A1A1A" opacity=".1"/>
  <!-- ボトル -->
  <rect x="148" y="170" width="104" height="156" rx="16" fill="url(#glass)"/>
  <rect x="152" y="250" width="96" height="72" rx="13" fill="url(#liquid)" opacity=".85"/>
  <!-- ガラス管(ラベルの後ろ) -->
  <rect x="196" y="176" width="8" height="120" rx="4" fill="#FFFFFF" opacity=".45"/>
  <!-- ラベル -->
  <rect x="164" y="204" width="72" height="62" rx="2" fill="#FFFFFF"/>
  <rect x="178" y="218" width="44" height="4" rx="2" fill="#2B2B2A"/>
  <rect x="184" y="230" width="32" height="2.5" rx="1.2" fill="#9A958C"/>
  <rect x="186" y="250" width="28" height="2.5" rx="1.2" fill="#C2A58C"/>
  <!-- 肩・カラー -->
  <rect x="166" y="150" width="68" height="26" rx="4" fill="url(#cap)"/>
  <!-- スポイト(ゴム) -->
  <path d="M178 150 V112 Q178 84 200 84 Q222 84 222 112 V150 Z" fill="url(#cap)"/>
</svg>
