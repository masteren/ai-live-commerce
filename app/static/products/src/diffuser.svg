<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 340 340">
  <!-- アロマディフューザー:すりガラス風の白いしずく型 + 木目の台座 + ミスト -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E6E0"/><stop offset=".4" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DAD6CF"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9825A"/><stop offset=".45" stop-color="#C9A27A"/><stop offset="1" stop-color="#94704C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".75" r=".5">
      <stop offset="0" stop-color="#FFE2B8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE2B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="336" rx="88" ry="10" fill="#1A1A1A" opacity=".1"/>
  <!-- 台座 -->
  <path d="M122 292 H278 L270 322 Q268 332 256 332 H144 Q132 332 130 322 Z" fill="url(#wood)"/>
  <path d="M136 304 H264 M140 316 H260" stroke="#7E5E3E" stroke-opacity=".35" stroke-width="2"/>
  <!-- 本体 -->
  <path d="M200 112 C236 150 282 206 282 252 C282 280 264 294 240 294 H160 C136 294 118 280 118 252 C118 206 164 150 200 112 Z" fill="url(#glass)"/>
  <ellipse cx="200" cy="262" rx="64" ry="34" fill="url(#glow)"/>
  <path d="M152 226 C158 196 176 170 190 152" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <!-- 吹き出し口 -->
  <ellipse cx="200" cy="114" rx="9" ry="4" fill="#BDB8B0"/>
  <!-- ミスト -->
  <path d="M200 100 C188 84 212 74 200 56" fill="none" stroke="#C9CFD6" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M216 96 C226 84 210 76 220 62" fill="none" stroke="#C9CFD6" stroke-width="4" stroke-linecap="round" opacity=".45"/>
  <path d="M184 96 C174 86 188 78 180 66" fill="none" stroke="#C9CFD6" stroke-width="4" stroke-linecap="round" opacity=".45"/>
</svg>
