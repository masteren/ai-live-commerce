  <rect x="144" y="108" width="112" height="16" rx="3" fill="url(#steel)"/>
  <!-- フタ -->
  <path d="M148 108 V84 Q148 70 162 70 H238 Q252 70 252 84 V108 Z" fill="url(#lid)"/>
  <rect x="226" y="58" width="22" height="14" rx="4" fill="#3A3A37"/>
  <!-- ロゴ風の刻印 -->
