<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理コンソール | AI Live Commerce</title>
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<h1>管理コンソール。<span>商品と配信の状況。</span></h1>
<div class="sub">商品の登録・在庫の変更・売上の確認ができます。<a href="/">配信ページを開く ›</a></div>

<div class="login">
  <input id="token" type="password" aria-label="管理者トークン" placeholder="管理者トークン(ADMIN_TOKEN)" style="flex:1;max-width:340px">
  <button id="loginBtn">ログイン</button>
</div>

<div id="panel" style="display:none">
  <h2>配信の状況
    <button class="small ghost" id="reloadBtn">更新</button>
    <button class="small ghost" id="botBtn">…</button>
  </h2>
  <div class="cards" id="stats"></div>

  <h2>商品</h2>
  <div class="wrap"><table id="ptable">
    <thead><tr><th>ID</th><th>記号</th><th>商品名</th><th>説明</th><th>価格</th><th>通常価格</th><th>在庫</th><th>タグ</th><th>状態</th><th></th></tr></thead>
    <tbody id="pbody"></tbody>
  </table></div>

  <h2>最近の注文</h2>
  <div class="wrap"><table>
    <thead><tr><th>#</th><th>購入者</th><th>内容</th><th>合計</th><th>日時</th></tr></thead>
    <tbody id="obody"></tbody>
  </table></div>
</div>

<div id="msg"></div>

<script src="/static/js/admin.js"></script>
</body>
</html>
