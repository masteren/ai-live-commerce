<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- アプリアイコンの元データ。iOS が角を丸く切り抜くので、ここでは四角のまま・透過なしで描く -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B02A62"/>
      <stop offset="1" stop-color="#6C0F35"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBE3EC"/>
    </linearGradient>
    <!-- 花びら1枚(中心から上向き。先端に桜の切れ込み) -->
    <path id="p" d="M0,-34 C-124,-112 -146,-286 -52,-346 Q-36,-356 -24,-342 L0,-316 L24,-342 Q36,-356 52,-346 C146,-286 124,-112 0,-34 Z"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512,528) scale(0.98)" fill="url(#petal)">
    <use href="#p"/>
    <use href="#p" transform="rotate(72)"/>
    <use href="#p" transform="rotate(144)"/>
    <use href="#p" transform="rotate(216)"/>
    <use href="#p" transform="rotate(288)"/>
  </g>
  <!-- 中心:配信中を表す点(Web・アプリの LIVE の赤) -->
  <circle cx="512" cy="528" r="58" fill="#84133F"/>
  <circle cx="512" cy="528" r="30" fill="#FF4B4B"/>
</svg>
