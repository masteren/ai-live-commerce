# /etc/nginx/sites-available/live.masteren.cloud → sites-enabled にリンクして使う
# 証明書は masteren.cloud の1枚(主ドメイン・www・fridge・tavern・live を含む)を使う

server {
    listen 80;
    listen [::]:80;
    server_name live.masteren.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name live.masteren.cloud;

    ssl_certificate /etc/letsencrypt/live/masteren.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masteren.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    # ライブ配信の WebSocket(Upgrade を通す。つながったままになるので読み取りの時間切れを長く)
    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
