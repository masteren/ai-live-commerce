# push / プルリクエストのたびに自動でテストを実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) 単体テスト(SQLite)
  unit-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # 2) 単体テスト(本物の MySQL 8.4:行ロック・utf8mb4_bin・マイグレーションを確認)
  unit-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start MySQL
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_DATABASE=livecommerce -e MYSQL_USER=liveuser -e MYSQL_PASSWORD=livepass \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            mysql:8.4 --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent && break
            sleep 2
          done
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: mysql+aiomysql://liveuser:livepass@127.0.0.1:3306/livecommerce?charset=utf8mb4

  # 3) E2E(実際にサーバを起動し、WebSocket を含む全体の流れを確認)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start server
        run: |
          uvicorn app.main:app --port 8001 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/products > /dev/null && break; sleep 1; done
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
          ADMIN_TOKEN: test-token
          VOICEVOX_ENABLED: "false"
          ANTHROPIC_API_KEY: ""
      - run: python test_e2e.py
        env:
          E2E_BASE: http://127.0.0.1:8001
      - name: Server log
        if: always()
        run: cat server.log
